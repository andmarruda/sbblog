# Local development: docker compose up -d, then open http://localhost:8000
# (test@example.com / password). See docs/v2/local-docker.md.
name: sbblog

x-php: &php
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: sbblog-dev
  volumes:
    - ./:/var/www/html
  # These win over .env, so the same .env also works outside Docker.
  environment: &php-env
    APP_ENV: local
    APP_URL: http://localhost:8000
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: 5432
    DB_DATABASE: sbblog
    DB_USERNAME: sbblog
    DB_PASSWORD: secret
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_SCHEME: null
    MAIL_USERNAME: null
    MAIL_PASSWORD: null
    # Webhooks to other containers (e.g. a local frontend) are private addresses.
    SBBLOG_ALLOW_PRIVATE_WEBHOOKS: "true"
  depends_on:
    pgsql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      <<: *php-env
      SBBLOG_SETUP: "1"
    healthcheck:
      test: ["CMD", "test", "-f", "storage/framework/docker-ready"]
      interval: 5s
      retries: 120

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  vite:
    <<: *php
    command: ["pnpm", "dev"]
    environment:
      <<: *php-env
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
    ports:
      - "${VITE_PORT:-5173}:5173"

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sbblog
      POSTGRES_USER: sbblog
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-5434}:5432"
    volumes:
      - sbblog-pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sbblog", "-d", "sbblog"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  sbblog-pgsql:
